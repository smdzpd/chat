<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 聊天室</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
    <!-- 顶部 -->
    <header>
        <h1 class="title">💬 AI 聊天室</h1>
        <div class="name-bar">
            <input type="text" id="nameInput" placeholder="输入昵称..." maxlength="12" />
            <span class="online-count" id="onlineCount">● 在线</span>
        </div>
    </header>

    <!-- 消息列表 -->
    <div class="chat-box" id="chatBox">
        <div class="loading">加载中...</div>
    </div>

    <!-- 输入区 -->
    <div class="input-bar">
        <textarea id="msgInput" placeholder="输入消息..." rows="1" maxlength="500"></textarea>
        <button id="sendBtn">发送</button>
    </div>
</div>

<script src="script.js?v=1"></script>
</body>
</html>
